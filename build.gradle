/*
group = 'com.mjc-school'
version = '1.0-SNAPSHOT'
*/
allprojects {}
subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    repositories {
        mavenCentral()
        mavenLocal()
    }

    java { toolchain { languageVersion = JavaLanguageVersion.of(11) } }

    testing { suites { test { useJUnitJupiter('5.9.1') } } }
}
